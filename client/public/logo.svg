<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gradX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="gradO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon/square -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#111827" stroke="#2A364F" stroke-width="3" />

  <!-- Mini Grid Lines -->
  <line x1="35" y1="18" x2="35" y2="82" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="65" y1="18" x2="65" y2="82" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="18" y1="35" x2="82" y2="35" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="18" y1="65" x2="82" y2="65" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- Cyber X on Top Left -->
  <path d="M 22 22 L 30 30 M 30 22 L 22 30" stroke="url(#gradX)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Cyber O on Bottom Right -->
  <circle cx="73" cy="73" r="4.5" stroke="url(#gradO)" stroke-width="3.5" fill="none" filter="url(#glow)" />

  <!-- Macro Neon Overlays -->
  <path d="M 38 38 L 62 62 M 62 38 L 38 62" stroke="url(#gradX)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
</svg>
