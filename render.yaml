services:
  # ----------------------------------------------------
  # Backend Web Service (Node.js + Express + Socket.io)
  # ----------------------------------------------------
  - type: web
    name: super-tic-tac-toe-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"

  # ----------------------------------------------------
  # Frontend Static Site (React + Vite + Tailwind CSS)
  # ----------------------------------------------------
  - type: web
    name: super-tic-tac-toe-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        value: https://super-tic-tac-toe-server.onrender.com
